<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0716">
<meta name="description" content="Pop Rush: pop bricks to keep the fuse lit, chain big pops for Rush Mode, and open chests full of skins.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pop Rush">
<title>Pop Rush</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/screens.css">
<link rel="stylesheet" href="css/run.css">
<link rel="stylesheet" href="css/chest.css">
<link rel="stylesheet" href="css/skins.css">
<link rel="stylesheet" href="css/s3-skins.css">
<link rel="stylesheet" href="css/s3-scenes.css">
<link rel="stylesheet" href="css/fuse.css">
<link rel="stylesheet" href="css/u4-boards.css">
<link rel="stylesheet" href="css/u4-skins.css">
<link rel="stylesheet" href="css/s4-skins.css">
<link rel="stylesheet" href="css/s4-scenes.css">
<link rel="stylesheet" href="css/hats.css">
<link rel="stylesheet" href="css/badges.css">
<link rel="stylesheet" href="css/coach.css">
</head>
<body>
<div id="splash" aria-hidden="true"><div class="sp-logo"><span>POP</span><b>RUSH</b></div><i class="sp-bar"><u></u></i></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="flash" aria-hidden="true"></div>

<div id="app">
  <div class="bg" id="bg" aria-hidden="true">
    <i class="scene-fx"></i><i class="scene-fx b"></i>
    <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>
    <div class="bg-bricks" id="bgBricks"></div>
    <div class="vignette"></div>
  </div>

  <main id="screens">
    <!-- The status bar lives outside the screens: it never moves when a tab changes (js/screens.js, BR.Chrome). -->
    <header class="topbar" id="topbar">
      <button class="lvl-badge" id="tbLevel" data-act="go-pass" type="button"></button>
      <h1 id="tbTitle"></h1>
      <button class="icon-btn gear-btn" id="tbGear" data-act="open-settings" type="button" aria-label="Settings"></button>
      <button class="pill gold coin-btn" id="tbCoins" data-act="go-coins" type="button" aria-label="Your Coins"></button>
    </header>
    <section class="screen" id="s-home" aria-label="Home"></section>
    <section class="screen" id="s-shop" aria-label="Shop"></section>
    <section class="screen" id="s-collection" aria-label="Collection"></section>
    <section class="screen" id="s-missions" aria-label="Missions"></section>
    <section class="screen" id="s-profile" aria-label="Profile"></section>

    <!-- ============ RUN ============ -->
    <section class="screen" id="s-run" aria-label="Game">
      <div class="run" id="run">
        <header class="run-top">
          <button class="icon-btn" id="btnPause" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
          <div class="score-box"><span class="lbl">Score</span><b id="score">0</b><div class="best-line" id="bestLine"><i id="bestFill"></i><span id="bestText">BEST 0</span></div></div>
        </header>

        <div class="fuse" id="fuse" aria-label="Fuse" data-fuse-host data-z="calm">
          <!-- Fizz: the bomb. The body is drawn per fuse (js/fuse-art.js); the face is shared and changes with the urgency (css/fuse.css, js/fuse.js) -->
          <div class="bomb" id="bomb" data-x="calm">
            <i class="fz-ring" aria-hidden="true"><svg viewBox="0 0 68 68"><circle class="bg" cx="34" cy="34" r="31"/><circle class="fg" cx="34" cy="34" r="31"/></svg></i>
            <div class="fz-pulse">
              <i class="fz-body"></i><i class="fz-hotin"></i><i class="fz-cracks"></i>
              <div class="fz-face" aria-hidden="true">
                <i class="fz-blush l"></i><i class="fz-blush r"></i>
                <i class="fz-eye l"><i class="fz-ball"><i class="fz-pupil"></i></i><i class="fz-lid"></i></i>
                <i class="fz-eye r"><i class="fz-ball"><i class="fz-pupil"></i></i><i class="fz-lid"></i></i>
                <i class="fz-brow l"></i><i class="fz-brow r"></i>
                <svg class="fz-mouth" viewBox="0 0 24 14">
                  <path class="m m-calm" d="M5 4Q12 11 19 4"/><path class="m m-watch" d="M7 6Q12 8.5 17 6"/><path class="m m-worried" d="M4.5 9.5Q8 4 12 8Q16 12 19.5 6.5"/>
                  <ellipse class="m f m-panic" cx="12" cy="7.4" rx="5.6" ry="5.2"/><ellipse class="m tg1" cx="12" cy="10.8" rx="3.2" ry="1.7"/>
                  <ellipse class="m f m-o" cx="12" cy="7" rx="3.4" ry="4.6"/>
                  <path class="m f m-glad" d="M3.5 3Q12 16.5 20.5 3Z"/><ellipse class="m tg2" cx="12" cy="9.2" rx="3.6" ry="1.9"/>
                </svg>
                <i class="fz-sweat"></i>
              </div>
              <i class="fz-frostb"></i>
            </div>
            <i class="fz-wick"></i>
          </div>
          <div class="fuse-track" id="fuseTrack">
            <div class="fz-rail"><i class="fz-burnflash"></i></div>
            <div class="fuse-fill" id="fuseFill"><div class="fz-in"><i class="fz-l fz-tex"></i><i class="fz-l fz-hot"></i><i class="fz-l fz-cr"></i><i class="fz-l fz-flow"></i><i class="fz-l fz-gold"></i><i class="fz-l fz-frost"></i><i class="fz-l fz-shim"></i><i class="fz-l fz-glint"></i></div></div>
            <i class="fz-ticks"></i>
            <canvas class="fz-cv" id="fuseFx" aria-hidden="true"></canvas>
            <b class="spark" id="spark"><i class="fz-heat"></i><i class="fz-ember"></i><i class="fz-ember hot"></i><i class="fz-ash"></i><i class="fz-redflash"></i><i class="fz-flare"><i class="fz-fl"><i class="fz-halo"></i><i class="fz-tongue"></i><i class="fz-core"></i><i class="fz-ringfx"></i></i></i></b>
          </div>
          <div class="fuse-time" id="fuseTimeBox">
            <svg class="fz-rring" viewBox="0 0 56 56" aria-hidden="true"><circle class="bg" cx="28" cy="28" r="26"/><circle class="fg" cx="28" cy="28" r="26"/></svg>
            <div class="fz-numbox"><b class="fz-num" id="fuseTime" data-m="w" role="timer" aria-label="30 seconds"><span class="fz-dg t"><i>3</i><i class="p"></i></span><span class="fz-dg o"><i>0</i><i class="p"></i></span><span class="fz-dp">.</span><span class="fz-dg x"><i>0</i><i class="p"></i></span></b></div>
            <span class="fz-unit" aria-hidden="true">
              <svg class="fz-ico ic-flame" viewBox="0 0 24 24"><path d="M12 2.5c1 3.5 4.5 5 4.5 9.5a4.5 4.5 0 0 1-9 0c0-2 1-3.2 2-4.2 0 2 1 2.7 2 2.7 0-3-.5-5 .5-8z"/></svg>
              <svg class="fz-ico ic-glass" viewBox="0 0 24 24"><path d="M7 3h10M7 21h10M8 3c0 5 4 6 4 9s-4 4-4 9M16 3c0 5-4 6-4 9s4 4 4 9"/></svg>
              <svg class="fz-ico ic-alert" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.01"/></svg>
              <svg class="fz-ico ic-snow" viewBox="0 0 24 24"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9M9.5 4.5L12 7l2.5-2.5M9.5 19.5L12 17l2.5 2.5"/></svg>
              <svg class="fz-ico ic-bolt" viewBox="0 0 24 24"><path d="M13 2.5L5 13.5h6l-1 8 8-11h-6z"/></svg>
              <span>sec</span>
            </span>
            <span class="fz-p4" aria-hidden="true"><small>Pop</small><b>4+</b></span>
          </div>
          <i class="fz-burst" aria-hidden="true"></i>
          <div class="fz-chips" aria-hidden="true"><b class="fz-chip"></b><b class="fz-chip"></b><b class="fz-chip"></b><b class="fz-chip"></b><b class="fz-chip"></b></div>
        </div>
        <div class="chillbar" id="chillbar">
          <div class="chill-moves"><b id="movesNum">20</b><span>moves</span></div>
          <div class="chill-goal"><i id="chillFill"></i><span id="chillText">0 / 1,500</span></div>
        </div>

        <div class="stagestrip" id="stageStrip">
          <div class="ss-row"><b class="ss-stage" id="stageTag">Stage <span id="stageNum">1</span></b><span class="ss-goal" id="stageGoal">0 / 1,000</span><em class="mult" id="multTag">x1.0 points</em></div>
          <div class="ss-track"><i id="stageFill"></i></div>
        </div>

        <div class="board-wrap" id="boardWrap">
          <div class="board" id="board"><div class="field" id="field" data-skin-host></div></div>
          <div class="fxlayer" id="fxlayer"></div>
          <div class="rush-glow" id="rushGlow"></div>
        </div>

        <div class="rushbar" id="rushBar"><i id="rushFill"></i><span id="rushLabel">RUSH</span></div>

        <div class="powerups" id="powerups"><div class="slots" id="slots"></div></div>

        <div class="msgband" id="msgBand" data-top="" role="status">
          <div class="m-combo combo" id="combo" aria-live="polite"><b id="comboX">Combo x2</b><span id="comboSub">3 big pops in a row</span></div>
          <div class="m-text hint" id="hint"></div>
          <div class="m-aim aim-banner" id="aimBanner"></div>
          <div class="m-goal" id="goalLine"></div>
          <div class="last-spark" id="lastSpark" aria-live="assertive"><b>LAST SPARK!</b><span>Pop 4 or more to relight the fuse</span><i class="ls-bar"><u id="lsFill"></u></i></div>
        </div>
      </div>
      <div class="vignette-warn" id="warnVignette"></div>
      <div class="stage-wipe" id="stageWipe" aria-hidden="true"><div class="sw-band"></div><div class="sw-text"><span>STAGE</span><b id="swNum">2</b><em id="swMult">x1.5</em></div></div>
      <div class="rush-banner" id="rushBanner" aria-hidden="true"><span>RUSH!</span></div>
    </section>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Main">
    <button class="tab" data-tab="shop"><svg viewBox="0 0 24 24"></svg><span>Shop</span><em class="tbadge" id="badgeShop" aria-hidden="true"></em></button>
    <button class="tab" data-tab="collection"><svg viewBox="0 0 24 24"></svg><span>Collection</span></button>
    <button class="tab tab-play" data-tab="home"><i class="play-disc"><svg viewBox="0 0 24 24"></svg></i><span>Home</span></button>
    <button class="tab" data-tab="missions"><svg viewBox="0 0 24 24"></svg><span>Missions</span><em class="dot" id="dotMissions"></em></button>
    <button class="tab" data-tab="profile"><svg viewBox="0 0 24 24"></svg><span>Profile</span></button>
    <i class="tab-ind" id="tabInd"></i>
  </nav>

  <div id="layer-overlays"></div>
  <div id="layer-opening"></div>
  <div id="layer-sheets"></div>
  <div id="toasts" aria-live="polite"><div class="toast-slot top" id="toastsTop"></div><div class="toast-slot bottom" id="toastsBottom"></div></div>
</div>

<noscript><p style="color:#fff;text-align:center;margin-top:30vh;font-family:sans-serif">Pop Rush needs JavaScript.</p></noscript>

<script src="js/rng.js"></script>
<script src="js/board.js"></script>
<script src="js/config.js"></script>
<script src="js/boosters.js"></script>
<script src="js/items.js"></script>
<script src="js/chests.js"></script>
<script src="js/director.js"></script>
<script src="js/engine.js"></script>
<script src="js/storage.js"></script>
<script src="js/pass.js"></script>
<script src="js/progress.js"></script>
<script src="js/missions.js"></script>
<script src="js/retention.js"></script>
<script src="js/audio.js"></script>
<script src="js/music.js"></script>
<script src="js/fx.js"></script>
<script src="js/skins.js"></script>
<script src="js/s3-skins.js"></script>
<script src="js/s3-pops.js"></script>
<script src="js/s3-scenes.js"></script>
<script src="js/fuse-art.js"></script>
<script src="js/fuse.js"></script>
<script src="js/u4-cosmetics.js"></script>
<script src="js/badges.js"></script>
<script src="js/hats.js"></script>
<script src="js/s4-skins.js"></script>
<script src="js/s4-pops.js"></script>
<script src="js/s4-scenes.js"></script>
<script src="js/s4-fuses.js"></script>
<script src="js/coach.js"></script>
<script src="js/view.js"></script>
<script src="js/ui.js"></script>
<script src="js/chestart.js"></script>
<script src="js/spin.js"></script>
<script src="js/openings.js"></script>
<script src="js/screens.js"></script>
<script src="js/run.js"></script>
<script src="js/main.js"></script>
</body>
</html>
